<style>
/* Cairn design system (github.com/JBelliriGenty/Cairn-NAS, DESIGN.md): tokens and components as in Cairn IaC,
   then this page's own parts. One hue per family; green/amber/red are kept for states. */
:root {
  --bg: #eef1f8; --panel: #ffffff; --fg: #131416; --muted: #5d5f60; --line: #e5e8ef; --control: #8b909a;
  --track: #eceff5; --primary: #1d1f20; --on-primary: #ffffff; --accent: #4f46e5;
  --ok: #1e7b4f; --bad: #b42318; --warn: #b54708; --warn-bg: #fef0c7; --sky: #f4f6fb;
  --f-physical: #64748b; --f-network: #0284c7; --f-hypervisor: #0d9488; --f-services: #db2777; --f-storage: #b45309;
  --radius: 8px; --radius-sheet: 16px;
  --duration-stagger: 30ms; --duration-slow: 400ms; --distance-base: 8px; --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0c0d12; --panel: #15161c; --fg: #f2f2f3; --muted: #a4a7ab; --line: #2a2c35; --control: #6b7080;
  --track: #23252e; --primary: #f2f2f3; --on-primary: #111213; --accent: #818cf8;
  --ok: #3fc07a; --bad: #f97066; --warn: #fdb022; --warn-bg: #2b2111; --sky: #05060b;
  --f-physical: #94a3b8; --f-network: #38bdf8; --f-hypervisor: #2dd4bf; --f-services: #f472b6; --f-storage: #fbbf24;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d12; --panel: #15161c; --fg: #f2f2f3; --muted: #a4a7ab; --line: #2a2c35; --control: #6b7080;
    --track: #23252e; --primary: #f2f2f3; --on-primary: #111213; --accent: #818cf8;
    --ok: #3fc07a; --bad: #f97066; --warn: #fdb022; --warn-bg: #2b2111; --sky: #05060b;
    --f-physical: #94a3b8; --f-network: #38bdf8; --f-hypervisor: #2dd4bf; --f-services: #f472b6; --f-storage: #fbbf24;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

.app { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 18px 12px; background: var(--bg); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
.brand b { display: block; font-size: 16px; }
.brand small { color: var(--muted); font-size: 12px; }
.logo { width: 30px; height: 30px; border-radius: 7px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; transition: background .15s, color .15s; }
#nav a:hover { background: var(--track); color: var(--fg); }
#nav a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--accent); font-weight: 600; }
#nav a.off { opacity: .55; }
#nav svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--c, var(--accent)); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.count { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 12px; }
.side-foot button { align-self: flex-start; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--control); background: var(--panel); cursor: pointer; font-size: 12px; }
main { padding: 24px 24px 40px; min-width: 0; background: var(--panel); margin: 8px 8px 8px 0;
  border: 1px solid var(--line); border-radius: var(--radius-sheet); min-height: calc(100vh - 16px); }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); align-content: start; }
  .side { display: contents; }
  .brand { padding: 12px 16px 4px; }
  #nav { position: sticky; top: 0; z-index: 5; flex-direction: row; overflow-x: auto; scrollbar-width: none; padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  #nav a { white-space: nowrap; }
  .count { display: none; }
  .side-foot { order: 1; flex-direction: row; flex-wrap: wrap; align-items: center; margin: 0; padding: 16px; }
  main { padding: 16px; margin: 0; border: 0; border-radius: 0; min-height: 0; }
}

.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; padding: 1px 4px; border-radius: 4px; }
.crumbs a:hover { color: var(--fg); background: var(--track); }
.crumbs span[aria-hidden] { opacity: .6; }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
h1 { margin: 0; font-size: 22px; font-weight: 600; }
.head > svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--c); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
h2 { font-size: 16px; font-weight: 600; margin: 24px 0 10px; }
.sub { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
.lead { color: var(--muted); max-width: 70ch; margin: 4px 0 16px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; background: var(--track); white-space: nowrap; }
.pill.fam { background: color-mix(in srgb, var(--c) 14%, var(--panel)); color: var(--c); }
.banner { display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; margin: 0 0 16px; border-radius: var(--radius); background: var(--warn-bg); color: var(--warn); }
.empty { color: var(--muted); margin: 0; }

/* tiles: a tile shows the element and, inside, its children one level down */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); align-items: start; }
.tile { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--c);
  border-radius: var(--radius); background: var(--panel); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s, box-shadow .15s; }
.tile:hover { border-color: var(--control); border-left-color: var(--c); box-shadow: 0 2px 10px rgb(0 0 0 / .06); }
.tile .t-h { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.tile b { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.tile .kind { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.tile .facts { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.inner { display: flex; flex-wrap: wrap; gap: 4px; }
.inner > span { padding: 1px 8px; border-radius: 99px; background: var(--track); font-size: 12px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.inner > span.more { background: none; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; background: var(--control); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.down { background: var(--bad); }
.inner .dot { display: inline-block; padding: 0; width: 6px; height: 6px; margin-right: 5px; vertical-align: 1px; }
#nav .dot { margin-left: auto; } #nav .dot + .count { margin-left: 6px; }
.states { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.states li { display: flex; gap: 8px; align-items: baseline; }
.states .dot { align-self: auto; transform: translateY(-1px); }
.tally { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.tally span { display: inline-flex; gap: 5px; align-items: center; }

/* overview: the families side by side */
.families { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); align-items: start; }
.family { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: var(--radius); color: inherit; text-decoration: none; }
a.family:hover { border-color: var(--control); border-top-color: var(--c); }
.family h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.family h3 svg { width: 18px; height: 18px; fill: none; stroke: var(--c); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.family.off { opacity: .6; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; padding: 8px 10px; border-radius: 8px; background: var(--track); min-width: 0; }
.stat span { color: var(--muted); font-size: 12px; }
.stat b { font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* dashboard: series panels as small SVG curves, points fetched on demand (api/panels/<id>) */
.charts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.chart { position: relative; padding: 8px 10px 6px; border-radius: 8px; background: var(--track); min-width: 0; }
.chart .ch { display: flex; align-items: baseline; gap: 8px; }
.chart .ch span { color: var(--muted); font-size: 12px; }
.chart .ch b { margin-left: auto; font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
.chart svg { display: block; width: 100%; height: 56px; overflow: visible; }
.chart .axis { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .leg { display: flex; gap: 10px; font-size: 11px; color: var(--muted); }
.chart .leg i { display: inline-block; width: 10px; height: 0; margin-right: 4px; vertical-align: 3px; border-top: 2px solid var(--c); }
.chart .leg i.b { border-top-style: dashed; }
.chart .tip { position: absolute; top: 4px; pointer-events: none; padding: 2px 6px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* an element: its facts, the same element elsewhere, its panels */
.about { display: flex; flex-direction: column; gap: 12px; margin: 12px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--track); color: inherit; text-decoration: none; font-size: 13px; }
a.chip:hover { border-color: var(--control); }
.chip i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.label { color: var(--muted); font-size: 12px; }
table { border-collapse: collapse; }
td, th { padding: 6px 12px 6px 0; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.mods td { white-space: nowrap; }
.mods td.wrap { white-space: normal; }
.set input, .set select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; width: 100%; box-sizing: border-box; }
.set input[type="checkbox"] { width: auto; }
.set table { width: 100%; max-width: 640px; table-layout: fixed; }
.set td { white-space: normal; overflow-wrap: anywhere; }
.set h2 { font-size: 15px; margin: 24px 0 4px; }
.set .save { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
.set .save button { border: 0; border-radius: 8px; padding: 8px 16px; background: var(--primary); color: var(--on-primary); cursor: pointer; font-weight: 600; }
.set .save button:disabled { opacity: .5; cursor: default; }
.bad { color: var(--bad); } .okc { color: var(--ok); }
code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

/* view switch (tiles / map), above every family page */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
.bar .crumbs { margin: 0; }
.views { display: inline-flex; margin-left: auto; padding: 2px; border-radius: 8px; background: var(--track); }
.views button { border: 0; background: none; padding: 3px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted); }
.views button[aria-pressed="true"] { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .1); }

/* map: a canvas of neurons; families glow, levels grow out of their parent with the zoom (semantic zoom) */
.mapwrap { position: relative; }
.stage { position: relative; overflow: hidden; height: 480px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sky);
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; contain: strict; view-transition-name: cm-focus; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage.hand { cursor: pointer; } .stage.grab { cursor: grabbing; }
.zoom { position: absolute; left: 10px; bottom: 10px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 16px; line-height: 1; }
.zoom button:hover { border-color: var(--control); }
.sheet { position: absolute; top: 10px; right: 10px; z-index: 2; width: min(380px, calc(100% - 20px)); max-height: calc(100% - 20px); overflow: auto;
  padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 24px rgb(0 0 0 / .14); }
.sheet .head h1 { font-size: 18px; }
.sheet .x { margin-left: auto; border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--muted); padding: 0 4px; }
.sheet .chips button { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--control); background: var(--panel); cursor: pointer; font-size: 13px; }
@media (max-width: 820px) { .sheet { top: auto; bottom: 10px; left: 10px; width: auto; max-height: 55%; } }
::view-transition-group(*) { animation-duration: var(--duration-slow); animation-timing-function: var(--ease-smooth-out); }
@media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }

.find { display: flex; gap: 8px; align-items: center; margin: 0 2px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; text-align: left; }

.veil { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; background: rgb(10 12 20 / .45); }
.pal { width: min(640px, 100%); max-height: 76vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgb(0 0 0 / .3); overflow: hidden; }

.pal .list { overflow: auto; padding: 6px; }
.pal .foot { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

.res mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: inherit; border-radius: 2px; }
.res .path { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.res .ip { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.res .pill { margin-left: auto; flex: none; font-size: 11px; }
.pal .empty { padding: 10px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; margin: 0; padding: 18px 22px; }
.keys dt { text-align: right; } .keys dd { margin: 0; color: var(--muted); }
.pal h2 { margin: 0; padding: 16px 22px 0; }
@media (max-width: 820px) { .find { margin: 4px 16px 8px; } .find kbd { display: none; } .res .path, .res .ip { display: none; } .veil { padding-top: 8vh; } }

function about(x) {

// ---------- dashboard: series panels drawn as inline SVG; /api/map carries each line's last value, the points come on demand ----------

    let i = 0; while (Math.abs(v) >= 1000 && i < 4) { v /= 1000; i++; }

}

const CHARTS = {}, POINTS = {};  // chart key -> panel with points; element id -> {at, panels}
const lastOf = l => Array.isArray(l.values) ? [...l.values].reverse().find(v => v !== null) ?? null : l.last ?? null;

  const head = p.lines.map(l => metric(lastOf(l), p.unit)).join(" · ");

    const path = vs => vs.map((v, j) => v === null ? "" : `${j && vs[j - 1] !== null ? "L" : "M"}${(j / Math.max(1, n - 1) * W).toFixed(1)},${(H - Math.min(v, top) / top * H).toFixed(1)}`).join("");

// after a render: fetch the points of the charts on screen (kept a minute), then redraw those charts in place
function fillCharts() {
  for (const box of document.querySelectorAll("[data-panels]")) {
    const id = box.dataset.panels, have = POINTS[id];
    const draw = () => {
      const el = [...document.querySelectorAll("[data-panels]")].find(b => b.dataset.panels === id);

    };

// hover a curve: the value at that time
addEventListener("pointermove", e => {

    p.lines.map(l => (p.lines.length > 1 ? t(l.name) + " " : "") + metric(l.values[j], p.unit)).join(" · ");

function level(f, path) {
  const roots = D.roots[f];
  const solo = roots.length === 1 ? D.nodes[roots[0]] : null;
  if (!path.length) {
    const head = solo ? `<span class="pill fam" style="--c:var(--f-${f})">${esc(t(solo.kind))}</span>` : "";
    const body = solo ? solo.children : roots;
    return crumbs(f, []) + `<div class="head" style="--c:var(--f-${f})">${dot({ rollup: worst(roots) })}${icon(f)}<h1>${esc(solo ? solo.name : t(f))}</h1>${head}</div>${banners()}
      ${!roots.length ? `<p class="empty">${esc(t("No module fills this family yet."))}</p>` : ""}${tally(f)}${solo ? about(solo) : ""}
      ${body.length ? `<div class="tiles" style="view-transition-name:cm-focus">${body.map(tile).join("")}</div>` : ""}`;
  }
  const id = BY_PATH[f + "/" + path.join("/")];
  if (!id) return crumbs(f, []) + `<h1>${esc(t("Not found: {p}", { p: path.join("/") }))}</h1><p><a href="#">${esc(t("Back to the overview"))}</a></p>`;
  const x = D.nodes[id], chain = [];
  for (let i = 1; i <= path.length; i++) chain.push(D.nodes[BY_PATH[f + "/" + path.slice(0, i).join("/")]]);
  return crumbs(f, chain.slice(0, -1)) + `<div class="head">${dot(x)}<h1>${esc(x.name || x.id)}</h1><span class="pill fam" style="--c:var(--f-${f})">${esc(t(x.kind))}</span></div>
    ${banners()}${about(x)}${x.children.length ? `<h2>${esc(t("Inside"))} · ${x.children.length}</h2><div class="tiles" style="view-transition-name:cm-focus">${x.children.map(tile).join("")}</div>` : ""}`;

// ---------- map view: the same tree as neurons on one canvas, semantic zoom ----------
// A core (the overview), a glowing soma per family (a family with a single root is that root), then each level
// grows out of its parent as you zoom in. Fibres carry impulses, red towards a failing element. Links between
// families (the same machine seen twice) show for the hovered or current element only.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)"), DARKQ = matchMedia("(prefers-color-scheme: dark)");
let MODE = "tiles", G = null, P = {}, VIS = {}, CAM = null, K0 = 1, SW = 0, SH = 0, FOCUS = "", SHEET = true, KEEP = false, JUMP = false;
let anim = 0, loopOn = false, HOVER = null, DRAWN = [], PULSES = [], lastSpawn = 0, COLORS = null, colorKey = "";
try { MODE = localStorage.getItem("cairn-map-view") === "map" ? "map" : "tiles"; PLACES = localStorage.getItem("cairn-map-places") || ""; } catch (e) {}

// the graph: "" is the core, "fam:<family>" a family; ALIAS maps a family's lone root to its soma
function graph() {
  const N = { "": { name: D.title, f: "", kids: D.families.map(f => "fam:" + f), d: 0, lv: worst(D.families.flatMap(f => D.roots[f])), up: null } }, ALIAS = {};
  for (const f of D.families) {
    const r = D.roots[f], solo = r.length === 1 ? D.nodes[r[0]] : null;
    N["fam:" + f] = { name: t(f) + (solo ? " · " + solo.name : ""), f, kids: solo ? solo.children : r, d: 1, lv: worst(r), up: "", x: solo };
    if (solo) ALIAS[solo.id] = "fam:" + f;
  }
  const walk = id => {
    for (const c of N[id].kids) {
      if (N[c]) continue;  // each element once
      const x = D.nodes[c];
      N[c] = { name: x.name || x.id, f: x.family, kids: x.children, d: N[id].d + 1, lv: x.rollup, up: id, x };
      walk(c);
    }
  };
  N[""].kids.forEach(walk);
  const E = Object.keys(N).filter(i => N[i].up !== null).map(i => [N[i].up, i]), X = [], seen = new Set();
  for (const [i0, x] of Object.entries(D.nodes)) for (const j0 of x.also) {
    const i = ALIAS[i0] || i0, j = ALIAS[j0] || j0, k = [i, j].sort().join("|");
    if (N[i] && N[j] && !seen.has(k)) { seen.add(k); X.push([i, j]); }
  }
  return { N, E, X, ALIAS, ids: Object.keys(N) };
}

// gestures: one pointer drags, two pinch, a tap is a click on the nearest point, a double tap on empty sky zooms in
const PTS = new Map();
let moved = false, downAt = null, lastTap = null;
const stagePos = e => { const r = $("#stage").getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function size() {
  const st = $("#stage");
  st.style.height = Math.max(360, innerHeight - (st.getBoundingClientRect().top + scrollY) - (innerWidth > 820 ? 70 : 50)) + "px";
  SW = st.clientWidth; SH = st.clientHeight;
  const ps = G.ids.filter(i => G.N[i].d <= 2).map(i => P[i]);
  K0 = Math.min((SW - 200) / (Math.max(...ps.map(p => p[0])) - Math.min(...ps.map(p => p[0])) || 1), (SH - 80) / (Math.max(...ps.map(p => p[1])) - Math.min(...ps.map(p => p[1])) || 1));
}
function mount(how) {
  const st = $("#stage");
  size();
  if (how === "jump" || !CAM) CAM = fit(FOCUS);
  else if (how === "fly") fly(fit(FOCUS));
  if (!loopOn) { loopOn = true; anim2 = requestAnimationFrame(frame); }
  st.addEventListener("wheel", e => {
    e.preventDefault(); cancelAnimationFrame(anim);
    zoomAt(stagePos(e), Math.exp(-e.deltaY * (e.deltaMode ? 16 : 1) * (e.ctrlKey ? .01 : .0015)));
  }, { passive: false });
  st.addEventListener("pointerdown", e => {
    if (e.button) return;
    PTS.set(e.pointerId, stagePos(e));
    if (PTS.size === 1) { moved = false; downAt = stagePos(e); }
    cancelAnimationFrame(anim);
  });
  st.addEventListener("pointerleave", () => { HOVER = null; st.classList.remove("hand"); });
  st.addEventListener("keydown", e => {
    const k = { "+": 1.5, "=": 1.5, "-": 1 / 1.5 }[e.key], pan = { ArrowLeft: [60, 0], ArrowRight: [-60, 0], ArrowUp: [0, 60], ArrowDown: [0, -60] }[e.key];
    if (k) zoomAt([SW / 2, SH / 2], k); else if (pan) CAM = { ...CAM, x: CAM.x + pan[0], y: CAM.y + pan[1] }; else if (e.key === "0") fly(fit("")); else return;
    e.preventDefault();
  });
}
addEventListener("pointermove", e => {
  const st = $("#stage");
  if (!st) return;
  if (!PTS.has(e.pointerId)) {
    if (e.target.closest && e.target.closest("#stage") && e.pointerType === "mouse") { HOVER = pick(...stagePos(e)); st.classList.toggle("hand", !!HOVER); }
    return;
  }
  const before = [...PTS.values()], old = PTS.get(e.pointerId), p = stagePos(e);
  PTS.set(e.pointerId, p);
  if (!moved && PTS.size === 1 && Math.hypot(p[0] - downAt[0], p[1] - downAt[1]) < 6) return;
  moved = true; st.classList.add("grab");
  if (PTS.size === 1) CAM = { ...CAM, x: CAM.x + p[0] - old[0], y: CAM.y + p[1] - old[1] };
  else if (PTS.size === 2) {
    const [a, b] = before, [c, d] = [...PTS.values()], m0 = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], m1 = [(c[0] + d[0]) / 2, (c[1] + d[1]) / 2];
    const f = (Math.hypot(c[0] - d[0], c[1] - d[1]) || 1) / (Math.hypot(a[0] - b[0], a[1] - b[1]) || 1);
    CAM = clamp({ k: CAM.k * f, x: m1[0] - (m0[0] - CAM.x) * f, y: m1[1] - (m0[1] - CAM.y) * f });
  }
});
function pointerEnd(e) {
  if (!PTS.delete(e.pointerId)) return;
  const st = $("#stage");
  if (!st) return PTS.clear();
  if (!PTS.size) st.classList.remove("grab");
  if (moved || PTS.size || e.type === "pointercancel") return;
  const p = stagePos(e), id = pick(...p), now = performance.now();
  if (id !== null) {  // a point: go there (its address), and open its details
    lastTap = null;
    const h = linkOf(id);
    if (h === (location.hash || "#")) { SHEET = true; fly(fit(FOCUS)); if (!$(".sheet")) route(); }
    else location.hash = h;
    return;
  }
  if (lastTap && now - lastTap.t < 350 && Math.hypot(p[0] - lastTap.p[0], p[1] - lastTap.p[1]) < 24) {
    lastTap = null; fly(clamp({ k: CAM.k * 2.5, x: p[0] - (p[0] - CAM.x) * 2.5, y: p[1] - (p[1] - CAM.y) * 2.5 }));
  } else lastTap = { t: now, p };
}
addEventListener("pointerup", pointerEnd);
addEventListener("pointercancel", pointerEnd);
addEventListener("resize", () => { if ($("#stage")) { const c = CAM && [(SW / 2 - CAM.x) / CAM.k, (SH / 2 - CAM.y) / CAM.k]; size(); if (c) CAM = { ...CAM, x: SW / 2 - c[0] * CAM.k, y: SH / 2 - c[1] * CAM.k }; } });

// tiles <-> map: the current element keeps its place (cm-focus) through a view transition
function setMode(v) {
  if (v === MODE) return;
  const go = () => { MODE = v; try { localStorage.setItem("cairn-map-view", v); } catch (e) {} JUMP = true; route(); };
  if (document.startViewTransition && !REDUCED.matches) document.startViewTransition(go); else go();
}
$("#main").addEventListener("click", e => {
  const v = e.target.closest("[data-view]"), z = e.target.closest("[data-zoom]");
  const g = e.target.closest("[data-group]");
  if (g && g.dataset.group !== PLACES) {  // the addresses below the family change: back to its page
    PLACES = g.dataset.group; try { localStorage.setItem("cairn-map-places", PLACES); } catch (e) {}
    location.hash = "#" + famSlug("physical"); load();
  }
  if (v) setMode(v.dataset.view);
  else if (e.target.closest("[data-close]")) { SHEET = false; const s = $(".sheet"); if (s) s.remove(); }
  else if (z && CAM) {
    const f = z.dataset.zoom === "in" ? 2 : .5;
    fly(z.dataset.zoom === "all" ? fit("") : clamp({ k: CAM.k * f, x: SW / 2 - (SW / 2 - CAM.x) * f, y: SH / 2 - (SH / 2 - CAM.y) * f }));
  }
});

function modules() {
  const rows = D.modules.map(m => `<tr><td><b>${esc(m.name)}</b></td><td class="${m.error ? "bad" : "okc"}">${esc(m.error ? m.error : t("answering"))}</td>
    <td>${esc(when(m.ok))}</td><td>${m.nodes}${m.dropped ? ` <span class="bad">(${m.dropped} ${esc(t("Items dropped (wrong format)"))})</span>` : ""}</td></tr>`).join("");
  return `<div class="head"><h1>${esc(t("Modules"))}</h1></div><p class="lead">${esc(t("The map is built from these modules, read again at their own interval. It stores nothing and writes nothing."))}</p>
    <table class="mods"><tr><th>${esc(t("Module"))}</th><th>${esc(t("State"))}</th><th>${esc(t("Last good read"))}</th><th>${esc(t("Elements"))}</th></tr>${rows}</table>
    <p class="sub">Cairn Map ${esc(D.version)}</p>`;
}

// the Settings page: each machine's place and kind, the modules on or off; saved on the server (settings_file)
function settings() {
  const S = D.settings || {}, ro = S.editable ? "" : " disabled";
  const ms = Object.values(D.nodes).filter(x => x.id.startsWith("phys:")).sort((a, b) => a.name.localeCompare(b.name));
  const places = [...new Set(ms.map(x => x.attrs.location).filter(Boolean))].sort();
  const rows = ms.map(x => `<tr data-m="${esc(x.name)}" data-k0="${esc(x.kind)}"><td><b>${esc(x.name)}</b></td>
    <td><input list="cm-places" data-place value="${esc(x.attrs.location || "")}" placeholder="${esc(t("No place"))}" aria-label="${esc(t("location") + " · " + x.name)}"${ro}></td>
    <td><select data-kind aria-label="${esc(t("Kind") + " · " + x.name)}"${ro}>${(S.kind_list || []).map(k => `<option value="${k}"${k === x.kind ? " selected" : ""}>${esc(t(k))}</option>`).join("")}</select></td></tr>`).join("");
  const mods = D.modules.map(m => `<tr><td><label><input type="checkbox" data-mod="${esc(m.name)}"${m.on !== false ? " checked" : ""}${ro}> <b>${esc(m.name)}</b></label></td>
    <td class="${m.error ? "bad" : "okc"}">${esc(m.on === false ? t("off") : m.error ? m.error : t("answering"))}</td></tr>`).join("");
  return `<div class="head"><h1>${esc(t("Settings"))}</h1></div>
    <p class="lead">${esc(t(S.editable ? "Saved on the server for everyone. The rest stays in the tools that own the data." : "Read only: no settings_file in the configuration."))}</p>
    <form class="set" id="set"><datalist id="cm-places">${places.map(p => `<option value="${esc(p)}">`).join("")}</datalist>
    <h2>${esc(t("Machines"))}</h2><p class="sub">${esc(t("A room or a rack per machine (type a new one to create it); once one is set, the Physical page can group by place."))}</p>
    <table class="mods"><tr><th>${esc(t("Machine"))}</th><th>${esc(t("location"))}</th><th>${esc(t("Kind"))}</th></tr>${rows}</table>
    <h2>${esc(t("Modules"))}</h2><p class="sub">${esc(t("A module switched off is no longer read; its elements leave the map."))}</p>
    <table class="mods">${mods}</table>
    <div class="save"><button type="submit"${ro}>${esc(t("Save"))}</button><span id="set-msg" role="status"></span></div></form>`;
}
async function saveSettings(f) {
  const S = D.settings || {}, places = {}, kinds = {};
  for (const tr of f.querySelectorAll("tr[data-m]")) {
    const m = tr.dataset.m, pl = tr.querySelector("[data-place]").value.trim(), k = tr.querySelector("[data-kind]").value;
    if (pl) (places[pl] = places[pl] || []).push(m);
    if (k !== tr.dataset.k0 || (S.kinds || {})[m]) kinds[m] = k;
  }
  const body = { places, kinds, disabled: [...f.querySelectorAll("[data-mod]")].filter(c => !c.checked).map(c => c.dataset.mod) };
  const msg = $("#set-msg"); msg.textContent = t("Saving…");
  try {
    const r = await fetch("api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.text()).trim() || r.status);
    VIEW = ""; await load(); $("#set-msg").textContent = t("Saved.");
  } catch (e) { msg.textContent = t("Not saved: {e}", { e: e.message }); }
}
addEventListener("submit", e => { if (e.target.id === "set") { e.preventDefault(); saveSettings(e.target); } });

function route() {
  if (!D) return;
  const parts = location.hash.slice(1).split("/").filter(Boolean).map(decodeURIComponent);
  const map = MODE === "map", key = location.hash, moved_ = key !== VIEW;
  let html, cur = "#";
  if (moved_) SHEET = true;
  if (!parts.length) html = map ? mapPage(null, []) : overview();
  else if (parts[0] === "modules") { html = modules(); cur = "#modules"; }
  else if (parts[0] === "settings") {
    if (!moved_ && $("#set")) { nav("#settings"); return; }  // the minute's reload keeps what is being typed
    html = settings(); cur = "#settings";
  }
  else {
    const f = famOf(parts[0]);
    if (f) { html = map ? mapPage(f, parts.slice(1)) : level(f, parts.slice(1)); cur = "#" + famSlug(f); }
    else html = `<h1>${esc(t("Not found: {p}", { p: parts.join("/") }))}</h1><p><a href="#">${esc(t("Back to the overview"))}</a></p>`;
  }
  nav(cur);
  const m = $("#main"), keepScroll = !moved_ && $(".sheet") ? $(".sheet").scrollTop : 0;
  m.innerHTML = html;
  if (keepScroll && $(".sheet")) $(".sheet").scrollTop = keepScroll;
  m.classList.toggle("enter", moved_ && !(map && $("#stage")));
  if (moved_ && !KEEP) scrollTo(0, 0);
  VIEW = key;
  fillCharts();
  // map: a click on a box keeps the camera, an address or a link flies to its element, the view switch jumps
  if ($("#stage")) mount(JUMP ? "jump" : KEEP || !moved_ ? "keep" : "fly");
  JUMP = KEEP = false;
}

function index() {
  BY_PATH = {};
  for (const [id, x] of Object.entries(D.nodes)) if (x.path && x.path.length) BY_PATH[x.family + "/" + x.path.join("/")] = id;
}

async function load() {
  try {
    const r = await fetch("api/map" + (PLACES ? "?places=1" : ""), { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    D = await r.json();
  } catch (e) {
    if (!D) $("#main").innerHTML = `<p class="banner">${esc(t("Could not load the map: {e}", { e: e.message }))}</p>`;
    return;
  }
  let pick = "";
  try { pick = localStorage.getItem("cairn-map-lang") || ""; } catch (e) {}
  LANG = (pick || D.lang || "en").slice(0, 2);
  document.documentElement.lang = LANG;
  for (const x of Object.values(D.nodes)) if (x.kind === "group") x.name = t(x.name);  // "Servers", "Storage"… in the page's language
  $("#find-label").textContent = t("Search");
  $("#brand-title").textContent = D.title;
  $("#brand-sub").textContent = t("Updated {t}", { t: new Date(D.time * 1000).toLocaleTimeString(LANG, { timeStyle: "short" }) });
  index();
  prepare();
  const keep = VIEW; VIEW = keep || null;
  route();
}

// ---------- search (a palette over a veil) and keyboard shortcuts ----------
const norm = s => String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
const byName = (a, b) => a.localeCompare(b, LANG, { numeric: true, sensitivity: "base" });
let FOUND = [], SEL = 0, BACK = null;
// every word must appear in the name, IP, aliases (domains, MAC…), kind, family or path; the name first, then the shortest path
function search(q) {
  const words = norm(q).trim().split(/\s+/).filter(Boolean), q0 = words.join(" ");
  if (!words.length) return [];
  return Object.entries(D.nodes).filter(([, x]) => x.path).map(([id, x]) => {
    const n = norm(x.name), hay = norm([x.name, x.attrs.ip, ...x.aliases, t(x.kind), t(x.family), x.path.join(" ")].join(" "));
    if (!words.every(w => hay.includes(w))) return null;
    return [n === q0 ? 0 : n.startsWith(q0) ? 1 : n.includes(q0) ? 2 : 3, x.path.length, id];
  }).filter(Boolean).sort((a, b) => a[0] - b[0] || a[1] - b[1] || byName(D.nodes[a[2]].name, D.nodes[b[2]].name)).slice(0, 40).map(r => r[2]);
}
function mark(name, q) {
  const w = norm(q).trim(), i = w ? norm(name).indexOf(w) : -1;
  return i < 0 ? esc(name) : esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + w.length)) + "</mark>" + esc(name.slice(i + w.length));
}
function results(q) {
  FOUND = search(q); SEL = Math.min(SEL, Math.max(0, FOUND.length - 1));
  if (!q.trim()) return `<p class="empty">${esc(t("{n} elements", { n: Object.keys(D.nodes).length }))}</p>`;
  if (!FOUND.length) return `<p class="empty">${esc(t("Nothing for “{q}”", { q }))}</p>`;
  return FOUND.map((id, i) => {
    const x = D.nodes[id], up = x.path.slice(0, -1).map((_, j) => (D.nodes[BY_PATH[x.family + "/" + x.path.slice(0, j + 1).join("/")]] || {}).name).filter(Boolean);
    return `<a class="res" role="option" id="res${i}" aria-selected="${i === SEL}" href="${href(x)}" data-i="${i}">${dot(x)}<b>${mark(x.name || x.id, q)}</b>
      <span class="path">${esc(up.join(" › "))}</span>${x.attrs.ip ? `<span class="ip">${esc(x.attrs.ip)}</span>` : ""}<span class="pill fam" style="--c:var(--f-${x.family})">${esc(t(x.family))} · ${esc(t(x.kind))}</span></a>`;
  }).join("");
}
function veil(html, label) {
  closeVeil();
  BACK = document.activeElement;
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
  v.addEventListener("click", e => { if (e.target === v) closeVeil(); });
  document.body.appendChild(v);
  return v;
}
function closeVeil() {
  const v = $(".veil");
  if (!v) return false;
  v.remove();
  if (BACK && BACK.focus) BACK.focus();
  return true;
}
function palette() {
  if (!D) return;
  const v = veil(`<input type="search" role="combobox" aria-expanded="true" aria-controls="found" aria-autocomplete="list" placeholder="${esc(t("Go to… (name, IP, kind, path)"))}" aria-label="${esc(t("Search"))}" autocomplete="off" spellcheck="false">
    <div class="list" id="found" role="listbox"></div><div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> ${esc(t("choose"))}</span><span><kbd>${esc(t("Enter"))}</kbd> ${esc(t("go"))}</span><span><kbd>${esc(t("Esc"))}</kbd> ${esc(t("close"))}</span></div>`, t("Search"));
  const i = v.querySelector("input"), l = v.querySelector(".list");
  const draw = () => {
    l.innerHTML = results(i.value);
    i.setAttribute("aria-activedescendant", FOUND.length ? "res" + SEL : "");
    const s = l.querySelector('[aria-selected="true"]');
    if (s) s.scrollIntoView({ block: "nearest" });
  };
  i.addEventListener("input", () => { SEL = 0; draw(); });
  i.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { SEL = Math.max(0, Math.min(FOUND.length - 1, SEL + (e.key === "ArrowDown" ? 1 : -1))); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && FOUND[SEL]) { e.preventDefault(); go(FOUND[SEL]); }
  });
  l.addEventListener("click", e => { const a = e.target.closest(".res"); if (a) { e.preventDefault(); go(FOUND[+a.dataset.i]); } });
  SEL = 0; draw(); i.focus();
}
function go(id) { BACK = null; closeVeil(); location.hash = href(D.nodes[id]); }
function help() {
  const k = (...ks) => ks.map(x => `<kbd>${esc(x)}</kbd>`).join(" "), or = ` ${esc(t("or"))} `;
  const rows = [[k("/") + or + k("Ctrl", "K"), "Search, by name, IP, domain, kind or path"], [k("0") + " … " + k("5"), "The overview, then the five families"],
    [k("t"), "Switch tiles and map"], [k("u") + or + k("⌫"), "Up one level"], [k("m"), "The modules"], [k("s"), "The settings"],
    [k(t("Esc")), "Close the search, the details or this help"], [k("?"), "This help"], [k("+", "−", "←", "↑", "→", "↓", "0"), "On the map: zoom, move, show all"]];
  veil(`<h2>${esc(t("Keyboard shortcuts"))}</h2><dl class="keys">${rows.map(([a, b]) => `<dt>${a}</dt><dd>${esc(t(b))}</dd>`).join("")}</dl>`, t("Keyboard shortcuts"));
}
function up() {
  const parts = location.hash.slice(1).split("/").filter(Boolean);
  location.hash = parts.length > 1 ? "#" + parts.slice(0, -1).join("/") : "#";
}
$("#find").addEventListener("click", palette);
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "k") { e.preventDefault(); if (!closeVeil()) palette(); return; }
  if (e.key === "Escape") { if (!closeVeil() && $(".sheet")) { SHEET = false; $(".sheet").remove(); } return; }
  const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
  if (typing || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || $(".veil") || !D) return;
  if (e.key === "/") palette();
  else if (e.key === "?") help();
  else if (/^[0-5]$/.test(e.key)) location.hash = ["#", ...D.families.map(f => "#" + famSlug(f))][+e.key];
  else if (e.key === "t" && location.hash !== "#modules") setMode(MODE === "map" ? "tiles" : "map");
  else if (e.key === "u" || e.key === "Backspace") up();
  else if (e.key === "m") location.hash = "#modules";
  else if (e.key === "s") location.hash = "#settings";
  else return;
  e.preventDefault();
});

// theme: auto, light, dark, remembered per browser
const THEMES = ["auto", "light", "dark"];
function theme(next) {
  let th = "auto";
  try { th = localStorage.getItem("cairn-map-theme") || "auto"; } catch (e) {}
  if (next) { th = THEMES[(THEMES.indexOf(th) + 1) % 3]; try { localStorage.setItem("cairn-map-theme", th); } catch (e) {} }
  th === "auto" ? document.documentElement.removeAttribute("data-theme") : document.documentElement.setAttribute("data-theme", th);
  $("#theme").textContent = t("Theme: " + th);
}
$("#theme").addEventListener("click", () => theme(true));
addEventListener("hashchange", route);
load().then(() => theme());
setInterval(load, 60000);
</script>
