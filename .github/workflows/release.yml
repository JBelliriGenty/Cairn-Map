# Tests on every push and pull request; a vX.Y.Z tag also creates the GitHub
# release, its notes taken from that version's section of CHANGELOG.md.
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_cairn_map.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " {p = ($2 == v); next} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
